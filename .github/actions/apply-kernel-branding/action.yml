name: 'Apply Kernel Branding & Timestamp'
description: 'Auto-detect kernel version, preserve SCM versioning, and set build timestamp'

inputs:
  variant:
    description: 'Kernel variant'
    required: true
  kernel_version:
    description: 'Optional kernel version override; auto-detected if empty'
    required: false
    default: ''
  android_version:
    description: 'Optional Android version override; auto-detected if empty'
    required: false
    default: ''
  version:
    description: 'Optional combined version override; auto-detected if empty'
    required: false
    default: ''
  sublevel:
    description: 'Optional kernel sublevel override; auto-detected if empty'
    required: false
    default: ''
  brand_name:
    description: 'Brand appended to the stock version. Empty preserves stock.'
    required: false
    default: ''
  keep_kmi:
    description: 'Preserve the existing kernel version and SCM suffix'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure Kernel Branding and Timestamp
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      env:
        INPUT_VARIANT: ${{ inputs.variant }}
        INPUT_KERNEL_VERSION: ${{ inputs.kernel_version }}
        INPUT_ANDROID_VERSION: ${{ inputs.android_version }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SUBLEVEL: ${{ inputs.sublevel }}
        BRAND_NAME: ${{ inputs.brand_name }}
        KEEP_KMI: ${{ inputs.keep_kmi }}
      run: |
        set -euo pipefail

        # Use a real, human-readable current timestamp.
        BUILD_TIMESTAMP="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
        echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"

        # Detect the source revision. Never fabricate a commit hash.
        COMMIT="$(git rev-parse --short=12 HEAD 2>/dev/null || true)"
        if [[ -n "$COMMIT" ]]; then
          echo "Source commit: $COMMIT"
        else
          echo "No Git commit available; SCM version detection may be limited."
        fi

        # Auto-detect kernel version from the source Makefile.
        DETECTED_VERSION="$(
          awk '$1 == "VERSION" {print $3; exit}' Makefile
        )"
        DETECTED_PATCHLEVEL="$(
          awk '$1 == "PATCHLEVEL" {print $3; exit}' Makefile
        )"
        DETECTED_SUBLEVEL="$(
          awk '$1 == "SUBLEVEL" {print $3; exit}' Makefile
        )"

        KERNEL_VERSION="${INPUT_KERNEL_VERSION:-${DETECTED_VERSION}.${DETECTED_PATCHLEVEL}.${DETECTED_SUBLEVEL}}"
        ANDROID_VERSION="${INPUT_ANDROID_VERSION:-$(grep -hE '^BRANCH=' build.config.common build.config.constants 2>/dev/null | head -n1 | cut -d= -f2- || true)}"

        # Infer Android version from Kleaf's common branch when available.
        if [[ -z "$ANDROID_VERSION" ]]; then
          BRANCH="$(git branch --show-current 2>/dev/null || true)"
          if [[ "$BRANCH" =~ (android[0-9]+) ]]; then
            ANDROID_VERSION="${BASH_REMATCH[1]}"
          else
            ANDROID_VERSION="android16"
            echo "WARNING: Android version could not be detected; defaulting to android16."
          fi
        fi

        # Detect the standard Kleaf/common branch version if not supplied.
        VERSION="${INPUT_VERSION:-}"
        if [[ -z "$VERSION" ]]; then
          VERSION="${ANDROID_VERSION}-${DETECTED_VERSION}.${DETECTED_PATCHLEVEL}"
        fi

        SUBLEVEL="${INPUT_SUBLEVEL:-$DETECTED_SUBLEVEL}"

        echo "Detected kernel version: $KERNEL_VERSION"
        echo "Detected Android version: $ANDROID_VERSION"
        echo "Detected combined version: $VERSION"
        echo "Detected sublevel: $SUBLEVEL"
        echo "Variant: $INPUT_VARIANT"
        echo "Build timestamp: $BUILD_TIMESTAMP"

        # Empty branding means do not modify setlocalversion at all.
        if [[ -z "$BRAND_NAME" ]]; then
          echo "Brand is empty: preserving stock kernel version."
          exit 0
        fi

        # Preserve stock KMI and SCM output by appending a suffix.
        # Do not replace the original setlocalversion implementation.
        if ! grep -q 'CUSTOM_KERNEL_BRANDING' scripts/setlocalversion; then
          cat >> scripts/setlocalversion <<'EOF'

        # CUSTOM_KERNEL_BRANDING
        if [ -n "${KERNEL_BRAND_SUFFIX:-}" ]; then
          echo "-${KERNEL_BRAND_SUFFIX}"
        fi
        EOF
        fi

        # Export the suffix to the Kleaf build environment.
        echo "KERNEL_BRAND_SUFFIX=$BRAND_NAME" >> "$GITHUB_ENV"

        chmod +x scripts/setlocalversion
        echo "Kernel branding enabled: -$BRAND_NAME"
