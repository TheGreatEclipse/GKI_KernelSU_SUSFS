name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (Kleaf)'

inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: true

  page_size:
    description: 'ARM64 page size: 4k or 16k'
    required: false
    type: string
    default: '4k'

  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false

  brand_name:
    description: 'Optional kernel version suffix; empty preserves stock version'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    - name: Prepare Kernel Version and Timestamp
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        INPUT_VERSION: ${{ inputs.version }}
        BRAND_NAME: ${{ inputs.brand_name }}
      run: |
        set -euo pipefail

        COMMON="$PWD/common"

        # Use the real current UTC time, never the Unix epoch fallback.
        BUILD_TIMESTAMP="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
        echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"

        # Detect the actual source revision.
        COMMIT="$(git -C "$COMMON" rev-parse --short=12 HEAD)"
        echo "Kernel source commit: $COMMIT"

        # Detect kernel version from the kernel Makefile.
        VERSION="$(awk '$1 == "VERSION" {print $3; exit}' "$COMMON/Makefile")"
        PATCHLEVEL="$(awk '$1 == "PATCHLEVEL" {print $3; exit}' "$COMMON/Makefile")"
        SUBLEVEL="$(awk '$1 == "SUBLEVEL" {print $3; exit}' "$COMMON/Makefile")"

        echo "Kernel base: $VERSION.$PATCHLEVEL.$SUBLEVEL"
        echo "Kernel config: $INPUT_VERSION"
        echo "Build timestamp: $BUILD_TIMESTAMP"

        # Do not touch version-generation files when branding is empty.
        if [[ -z "$BRAND_NAME" ]]; then
          echo "Empty brand: stock version generation remains unchanged."
          exit 0
        fi

        # Preserve the original setlocalversion implementation.
        # A wrapper appends branding to its complete output, including SCM.
        SCRIPT="$COMMON/scripts/setlocalversion"
        STOCK="$COMMON/scripts/setlocalversion.stock"

        if [[ ! -f "$STOCK" ]]; then
          cp -p "$SCRIPT" "$STOCK"
        fi

        cat > "$SCRIPT" <<'WRAPPER'
        #!/bin/sh
        set -eu

        SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
        STOCK_SCRIPT="$SCRIPT_DIR/setlocalversion.stock"

        VERSION_OUTPUT="$("$STOCK_SCRIPT" "$@")"

        if [ -n "${KERNEL_BRAND_SUFFIX:-}" ]; then
          printf '%s-%s\n' "$VERSION_OUTPUT" "$KERNEL_BRAND_SUFFIX"
        else
          printf '%s\n' "$VERSION_OUTPUT"
        fi
        WRAPPER

        chmod +x "$SCRIPT"

        echo "KERNEL_BRAND_SUFFIX=$BRAND_NAME" >> "$GITHUB_ENV"
        echo "Branding enabled: -$BRAND_NAME"

    - name: Build Kernel
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        PAGE_SIZE: ${{ inputs.page_size }}
        BRAND_NAME: ${{ inputs.brand_name }}
      run: |
        set -euo pipefail

        sed -i 's/check_defconfig//' ./common/build.config.gki

        # Use the same timestamp in both build systems.
        BUILD_TIMESTAMP="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"

        if [ -f "build/build.sh" ]; then
          if [ "$PAGE_SIZE" != "4k" ]; then
            echo "ERROR: page_size=$PAGE_SIZE requires Kleaf." >&2
            exit 1
          fi

          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          KBUILD_BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          KERNEL_BRAND_SUFFIX="$BRAND_NAME" \
          CC="/usr/bin/ccache clang" \
          CXX="/usr/bin/ccache clang++" \
          HOSTCC="/usr/bin/ccache clang" \
          HOSTCXX="/usr/bin/ccache clang++" \
          build/build.sh -j"$(nproc)"
        else
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel

          PAGE_SIZE_FLAGS=()
          if [ "$PAGE_SIZE" = "16k" ]; then
            PAGE_SIZE_FLAGS+=(--page_size=16k)
          elif [ "$PAGE_SIZE" != "4k" ]; then
            echo "ERROR: unsupported page size: $PAGE_SIZE" >&2
            exit 1
          fi

          BAZEL_ENV_FLAGS=(
            "--action_env=KBUILD_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"
          )

          if [ -n "$BRAND_NAME" ]; then
            BAZEL_ENV_FLAGS+=(
              "--action_env=KERNEL_BRAND_SUFFIX=$BRAND_NAME"
            )
          fi

          tools/bazel build \
            --config=fast \
            "${PAGE_SIZE_FLAGS[@]}" \
            "${BAZEL_ENV_FLAGS[@]}" \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image
        fi

    - name: Verify Page Size in Generated .config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        PAGE_SIZE: ${{ inputs.page_size }}
      run: |
        set -euo pipefail

        CONFIG_FILE=""
        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do
          if [ -f "$candidate" ]; then
            CONFIG_FILE="$candidate"
            break
          fi
        done

        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out \
            -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
        fi

        if [ -z "$CONFIG_FILE" ]; then
          if [ "$PAGE_SIZE" = "4k" ]; then
            echo "WARNING: no .config found; skipping 4k verification."
            exit 0
          fi
          echo "ERROR: cannot locate generated .config." >&2
          exit 1
        fi

        echo "Verifying $CONFIG_FILE"
        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' \
          "$CONFIG_FILE" || true

        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi

        grep -qx "$want_on" "$CONFIG_FILE" || {
          echo "ERROR: expected $want_on" >&2
          exit 1
        }

        grep -qx "$want_off" "$CONFIG_FILE" || {
          echo "ERROR: expected $want_off" >&2
          exit 1
        }

        echo "Page size verified: $PAGE_SIZE"

    - name: Gather Build Artifacts
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          cp bazel-bin/common/kernel_aarch64/Image \
            "${{ github.workspace }}/AnyKernel3/Image"
        elif [ -f "/home/runner/out/dist/Image" ]; then
          cp /home/runner/out/dist/Image \
            "${{ github.workspace }}/AnyKernel3/Image"
        else
          echo "ERROR: kernel Image not found." >&2
          exit 1
        fi
